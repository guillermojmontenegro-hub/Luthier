[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-auditor"
version = "0.1.0"
description = "Static auditor for agent skills with runtime-agnostic contracts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.11.0"]

[project.scripts]
skill-auditor = "cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cli", "core", "adapters", "policies", "prompts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
